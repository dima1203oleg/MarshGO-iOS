name: iOS Simulator Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require immutable inputs for release builds
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SITE_REF: ${{ vars.MARSHGO_SITE_SHA }}
          SERVER_REF: ${{ vars.MARSHGO_SERVER_SHA }}
          MIGRATION_VERSION: ${{ vars.MARSHGO_DATABASE_MIGRATION_VERSION }}
          API_VERSION: ${{ vars.MARSHGO_API_CONTRACT_VERSION }}
          API_BASE_URL: ${{ vars.MARSHGO_API_BASE_URL }}
        run: |
          if [[ ! "$SITE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release builds require MARSHGO_SITE_SHA to be a full 40-character commit SHA." >&2
            exit 1
          fi
          if [[ ! "$SERVER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release builds require MARSHGO_SERVER_SHA to be a full 40-character commit SHA." >&2
            exit 1
          fi
          if [[ -z "$MIGRATION_VERSION" || -z "$API_VERSION" ]]; then
            echo "Release builds require MARSHGO_DATABASE_MIGRATION_VERSION and MARSHGO_API_CONTRACT_VERSION." >&2
            exit 1
          fi
          if [[ ! "$API_BASE_URL" =~ ^https://[^/[:space:]]+(/[^[:space:]]*)?$ ]]; then
            echo "Release builds require MARSHGO_API_BASE_URL to be a public HTTPS origin/path." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: dima1203oleg/MarshGO-Site
          # Development CI may follow main. A release tag must use the exact
          # Site commit stored in the MARSHGO_SITE_SHA repository variable.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && vars.MARSHGO_SITE_SHA || '44a5e4a4b7281d78b72554d7ddfad3ee1bbe9492' }}
          path: web
      - name: Verify checked-out Site revision
        env:
          SITE_REF: ${{ startsWith(github.ref, 'refs/tags/') && vars.MARSHGO_SITE_SHA || '44a5e4a4b7281d78b72554d7ddfad3ee1bbe9492' }}
        run: |
          ACTUAL_SITE_REF="$(git -C web rev-parse HEAD)"
          if [[ "$ACTUAL_SITE_REF" != "$SITE_REF" ]]; then
            echo "Checked-out Site $ACTUAL_SITE_REF does not match pinned release SHA $SITE_REF." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --prefix web
      - run: npm ci
      - name: Build bundled site and sync Capacitor
        env:
          CAPACITOR_BUILD: "true"
          VITE_API_BASE_URL: ${{ vars.MARSHGO_API_BASE_URL }}
          MARSHGO_SERVER_SHA: ${{ startsWith(github.ref, 'refs/tags/') && vars.MARSHGO_SERVER_SHA || '134ed017828a020e1d5f696b3cb9ea95527bb093' }}
          MARSHGO_API_CONTRACT_VERSION: ${{ vars.MARSHGO_API_CONTRACT_VERSION }}
          MARSHGO_DATABASE_MIGRATION_VERSION: ${{ vars.MARSHGO_DATABASE_MIGRATION_VERSION }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          npm run site:build
          npx cap sync ios
      - name: Verify embedded release manifest
        env:
          SERVER_REF: ${{ startsWith(github.ref, 'refs/tags/') && vars.MARSHGO_SERVER_SHA || '134ed017828a020e1d5f696b3cb9ea95527bb093' }}
          SITE_REF: ${{ startsWith(github.ref, 'refs/tags/') && vars.MARSHGO_SITE_SHA || '44a5e4a4b7281d78b72554d7ddfad3ee1bbe9492' }}
          IOS_REF: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('web/dist/release-manifest.json', 'utf8'));
          const expected = { serverCommit: process.env.SERVER_REF, siteCommit: process.env.SITE_REF, iosCommit: process.env.IOS_REF };
          for (const [key, value] of Object.entries(expected)) {
            if (manifest[key] !== value) throw new Error(`${key} mismatch: expected ${value}, received ${manifest[key]}`);
          }
          console.log(`Verified exact release inputs: Server ${expected.serverCommit}, Site ${expected.siteCommit}, iOS ${expected.iosCommit}`);
          NODE
      - name: Compile for iOS Simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned Release archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ARCHIVE_NAME: ${{ github.ref_name }}
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/MARSHGO-${ARCHIVE_NAME}.xcarchive"
          CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MARSHGO-${{ github.ref_name }}-unsigned-archive
          path: ${{ runner.temp }}/MARSHGO-${{ github.ref_name }}.xcarchive
          if-no-files-found: error
